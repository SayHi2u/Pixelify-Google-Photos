plugins {
    id 'com.android.application'
}

// Release signing is read from an untracked keystore.properties file. Do not fall back to the
// public debug key for release builds: anyone can sign an APK with it.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new InputStreamReader(
            new FileInputStream(keystorePropertiesFile), java.nio.charset.StandardCharsets.UTF_8))
}
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties.getProperty('storeFile') &&
        keystoreProperties.getProperty('storePassword') &&
        keystoreProperties.getProperty('keyAlias') &&
        keystoreProperties.getProperty('keyPassword')
if (keystorePropertiesFile.exists() && !hasReleaseKeystore) {
    logger.warn('keystore.properties is incomplete; release APK will be unsigned.')
}

android {
    namespace 'balti.xposed.pixelifygooglephotos'
    compileSdk 37
    buildToolsVersion '37.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "balti.xposed.pixelifygooglephotos"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "5.1"

        ndk {
            // Keep the APK small. The module only needs the native ACC_FINAL helper.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        // AGP 9.3.1's lint analyzer uses Java 21 APIs (List.removeLast()) and crashes when
        // Gradle runs on JDK 17. Keep release builds working on JDK 17; run `./gradlew lint`
        // with JDK 21 when static analysis is needed.
        if (org.gradle.api.JavaVersion.current() < org.gradle.api.JavaVersion.VERSION_21) {
            checkReleaseBuilds = false
        }
    }
    packaging {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += '**'
        }
        jniLibs {
            // Uncompressed libraries can be loaded directly from the module APK by the
            // framework's module classloader (System.loadLibrary -> findLibrary).
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    // Modern Xposed API (libxposed). compileOnly: only needed at compile time, the
    // framework provides the classes at runtime in hooked processes.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Xposed framework <-> module app communication (Remote Preferences), packaged into the APK.
    implementation 'io.github.libxposed:service:102.0.0'
}
