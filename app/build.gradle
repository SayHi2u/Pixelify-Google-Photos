plugins {
    id 'com.android.application'
}

android {
    namespace 'balti.xposed.pixelifygooglephotos'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "balti.xposed.pixelifygooglephotos"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign the release build with the debug key so the APK can be installed directly.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    packaging {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += '**'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    // Modern Xposed API (libxposed). compileOnly: only needed at compile time, the
    // framework provides the classes at runtime in hooked processes.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Xposed framework <-> module app communication (Remote Preferences), packaged into the APK.
    implementation 'io.github.libxposed:service:102.0.0'
}
